<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เจ๊สุมาลีรับจ้างแซ็กรังติดกระดุม | หนองแขม กรุงเทพฯ</title>
  <meta name="description" content="รับจ้างแซ็กรังติดกระดุม ประสบการณ์มากกว่า 30 ปี รับงาน Order ใหญ่ได้ไม่จำกัด มีคุณภาพ ส่งตรงเวลา ดูรูปผลงานและคลิปการทำงานได้ที่นี่">
  <!-- ตัวอย่างที่ขึ้นเวลาแชร์ลิงก์ใน LINE / Facebook -->
  <meta property="og:title" content="เจ๊สุมาลีรับจ้างแซ็กรังติดกระดุม | หนองแขม กรุงเทพฯ">
  <meta property="og:description" content="ประสบการณ์มากกว่า 30 ปี รับ Order ใหญ่ไม่จำกัด ดูรูปผลงานและคลิปการทำงาน">
  <meta property="og:image" content="https://dechaphoprre-hub.github.io/jsu-factory/images/cover.jpg">
  <meta property="og:url" content="https://dechaphoprre-hub.github.io/jsu-factory/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a href="#top" class="brand"><img src="images/logo-navy.png" alt="" class="brand-logo"><span data-bind="shortName">เจ๊สุมาลี</span></a>
      <nav class="nav">
        <a href="#works">ผลงาน</a>
        <a href="#videos">คลิป</a>
        <a href="#contact">ติดต่อ</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- ===== หน้าแรก ===== -->
    <section class="hero">
      <div class="wrap hero-in">
        <img src="images/logo-white.png" alt="โลโก้ เจ๊สุมาลี" class="hero-logo">
        <p class="eyebrow" data-bind="name">เจ๊สุมาลีรับจ้างแซ็กรังติดกระดุม</p>
        <h1 data-bind="tagline">รับจ้างแซ็กรัง ติดกระดุม</h1>
        <p class="lead" data-bind="intro"></p>
        <div class="cta" id="hero-cta"></div>
        <ul class="quick">
          <li><span class="qi">⏰</span><span data-bind="hours"></span></li>
          <li><span class="qi">📍</span><a id="hero-map" target="_blank" rel="noopener">ดูเส้นทางใน Google Map</a></li>
        </ul>
      </div>
      <svg class="stitch" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 20 H1200" />
      </svg>
    </section>

    <!-- ===== บริการ ===== -->
    <section class="section" id="services">
      <div class="wrap">
        <h2>บริการของเรา</h2>
        <div class="services" id="services-list"></div>
      </div>
    </section>

    <!-- ===== รูปผลงาน ===== -->
    <section class="section alt" id="works">
      <div class="wrap">
        <h2>รูปผลงาน</h2>
        <p class="sub">กดที่รูปเพื่อดูภาพขนาดใหญ่</p>
        <div class="filters" id="filters"></div>
        <div class="gallery" id="gallery"></div>
        <div class="more-wrap"><button class="btn btn-more" id="more" hidden></button></div>
      </div>
    </section>

    <!-- ===== คลิปการทำงาน ===== -->
    <section class="section" id="videos">
      <div class="wrap">
        <h2>คลิปการทำงาน</h2>
        <p class="sub">ชมขั้นตอนการทำงานจริงในโรงงาน</p>
        <div class="videos" id="video-list"></div>
      </div>
    </section>

    <!-- ===== ติดต่อ ===== -->
    <section class="section alt" id="contact">
      <div class="wrap contact">
        <div>
          <h2>ติดต่อ / สอบถามราคา</h2>
          <ul class="info" id="contact-info"></ul>
          <div class="cta" id="contact-cta"></div>
        </div>
        <div class="where">
          <div class="map">
            <iframe id="map-frame" title="แผนที่" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <figure class="storefront" id="storefront"></figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">© <span id="year"></span> <span data-bind="name"></span></div>
  </footer>

  <!-- ปุ่มลอยมุมจอ (มือถือ) -->
  <div class="float-bar" id="float-bar"></div>

  <!-- กล่องดูรูปใหญ่ -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="ปิด">×</button>
    <button class="lb-prev" aria-label="รูปก่อนหน้า">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-next" aria-label="รูปถัดไป">›</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
